<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="assets/css/style.css"></link>
</head>
<body>
    <h1>iPhone Calculator</h1>
    
    <div class="container">
        <div class="calculadora">
            <input id="visual" disabled></input>
            <table>
            <!-- 1 -->
                <tr>
                    <td>
                        <button id="ac" class="btn upper-symbols">AC</button>
                    </td>
                    <td>
                        <button id="moreLess" class="btn upper-symbols">+/-</button>
                    </td>
                    <td>
                        <button id="percentage" class="btn upper-symbols">%</button>
                    </td>
                    <td>
                        <button class="btn operator">÷</button>
                    </td>
                </tr>
            <!-- 2 -->
                <tr>
                    <td>
                        <button class="btn number">7</button>
                    </td>
                    <td>
                        <button class="btn number">8</button>
                    </td>
                    <td>
                        <button class="btn number">9</button>
                    </td>
                    <td>
                        <button class="btn operator">x</button>
                    </td>
                </tr>
                <!-- 3 -->
                <tr>
                    <td>
                        <button class="btn number">4</button>
                    </td>
                    <td>
                        <button class="btn number">5</button>
                    </td>
                    <td>
                        <button class="btn number">6</button>
                    </td>
                    <td>
                        <button class="btn operator">-</button>
                    </td>
                </tr>
                <!-- 4 -->
                <tr>
                    <td>
                        <button class="btn number">1</button>
                    </td>
                    <td>
                        <button class="btn number">2</button>
                    </td>
                    <td>
                        <button class="btn number">3</button>
                    </td>
                    <td>
                        <button class="btn operator">+</button>
                    </td>
                </tr>
                <!-- 4 -->
                <tr>
                    <td>
                        <button class="btn" id="rand">RAND</button>
                    </td>
                    <td>
                        <button class="btn number">0</button>
                    </td>
                    <td>
                        <button class="btn" id="comma">,</button>
                    </td>
                    <td>
                        <button class="btn" id="result">=</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    
    <script src="assets/js/main.js"></script>
</body>
</html>
